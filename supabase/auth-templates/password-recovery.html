<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Evo Rentals password</title>
  </head>
  <body style="margin:0;background:#07111f;color:#e5edf8;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#07111f;padding:32px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#101827;border:1px solid #243349;border-radius:16px;overflow:hidden;">
          <tr><td style="padding:32px 32px 8px;">
            <p style="margin:0;color:#34d399;font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;">Evo Rentals</p>
            <h1 style="margin:18px 0 12px;font-size:28px;line-height:1.25;color:#f8fafc;">Reset your password</h1>
            <p style="margin:0;color:#b6c5d8;font-size:16px;line-height:1.6;">We received a request to reset the password for {{ .Email }}.</p>
          </td></tr>
          <tr><td style="padding:24px 32px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#3b82f6;border-radius:8px;color:#ffffff;font-size:16px;font-weight:700;padding:14px 22px;text-decoration:none;">Choose a new password</a>
          </td></tr>
          <tr><td style="padding:0 32px 32px;">
            <p style="margin:0;color:#8fa4bd;font-size:14px;line-height:1.6;">If you did not request this, you can safely ignore this email. Do not forward this link to anyone.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
